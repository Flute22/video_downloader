name: Build macOS App

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
  push:
    paths:
      - 'desktop_app.py'
      - 'requirements.txt'
      - '.github/workflows/build-macos.yml'

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter>=5.2.0 yt-dlp instaloader>=4.10 requests>=2.31.0 Pillow>=10.0.0 pyinstaller>=6.0.0

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --noconfirm \
            --onefile \
            --windowed \
            --name "AnyVideo" \
            --icon NONE \
            --hidden-import "customtkinter" \
            --hidden-import "PIL" \
            --hidden-import "yt_dlp" \
            --hidden-import "instaloader" \
            --collect-all "customtkinter" \
            desktop_app.py

      - name: Verify build
        run: |
          echo "=== Build output ==="
          ls -la dist/
          if [ -d "dist/AnyVideo.app" ]; then
            echo "✅ AnyVideo.app found"
          elif [ -f "dist/AnyVideo" ]; then
            echo "✅ AnyVideo binary found"
          else
            echo "❌ Build failed - no output found"
            exit 1
          fi

      - name: Create DMG
        run: |
          mkdir -p dmg_contents
          if [ -d "dist/AnyVideo.app" ]; then
            cp -R dist/AnyVideo.app dmg_contents/
          else
            # For --onefile builds, wrap the binary in an .app bundle
            mkdir -p dmg_contents/AnyVideo.app/Contents/MacOS
            cp dist/AnyVideo dmg_contents/AnyVideo.app/Contents/MacOS/AnyVideo
            chmod +x dmg_contents/AnyVideo.app/Contents/MacOS/AnyVideo
            cat > dmg_contents/AnyVideo.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>AnyVideo</string>
            <key>CFBundleName</key>
            <string>AnyVideo</string>
            <key>CFBundleIdentifier</key>
            <string>com.anyvideo.app</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          fi
          
          # Create a symlink to /Applications for drag-and-drop install
          ln -s /Applications dmg_contents/Applications
          
          # Create DMG
          hdiutil create -volname "AnyVideo" -srcfolder dmg_contents -ov -format UDZO AnyVideo.dmg
          
          echo "=== DMG created ==="
          ls -la AnyVideo.dmg

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyVideo-macOS
          path: AnyVideo.dmg
          retention-days: 90

      - name: Commit DMG to website folder
        run: |
          cp AnyVideo.dmg website/AnyVideo.dmg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/AnyVideo.dmg
          git commit -m "build: update macOS DMG from GitHub Actions" || echo "No changes to commit"
          git push

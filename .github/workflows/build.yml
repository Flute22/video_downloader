name: Build Desktop Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp instaloader requests Pillow customtkinter pyinstaller
        
    - name: Build with PyInstaller
      run: python build_action.py
      
    - name: Package macOS App (DMG)
      if: runner.os == 'macOS'
      run: |
        npm install -g create-dmg
        create-dmg dist/AnyVideo.app || echo "create-dmg failed, taking fallback"
        mv AnyVideo*.dmg dist/AnyVideo.dmg || echo "No DMG found"
        
    - name: Upload Windows Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: AnyVideo-Windows
        path: dist/AnyVideo.exe
        
    - name: Upload macOS Artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: AnyVideo-macOS
        path: dist/AnyVideo.dmg

    - name: Commit binary to website folder
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          cp dist/AnyVideo.exe website/AnyVideo.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/AnyVideo.exe
          git commit -m "build: update Windows EXE from GitHub Actions" || echo "No changes to commit"
          git push || echo "Push failed (check permissions)"
        elif [ "$RUNNER_OS" == "macOS" ]; then
          cp dist/AnyVideo.dmg website/AnyVideo.dmg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/AnyVideo.dmg
          git commit -m "build: update macOS DMG from GitHub Actions" || echo "No changes to commit"
          git push || echo "Push failed (check permissions)"
        fi
      shell: bash

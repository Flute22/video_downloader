[build]
  # The directory that contains the website files
  publish = "website"

[[redirects]]
  from = "/download"
  to = "https://anyvideo-backend.onrender.com/download"
  status = 200
  force = true

[[redirects]]
  from = "/bulk-download"
  to = "https://anyvideo-backend.onrender.com/bulk-download"
  status = 200
  force = true

[[redirects]]
  from = "/downloads"
  to = "https://anyvideo-backend.onrender.com/downloads"
  status = 200
  force = true

[[redirects]]
  from = "/download-file/*"
  to = "https://anyvideo-backend.onrender.com/download-file/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/download-folder/*"
  to = "https://anyvideo-backend.onrender.com/download-folder/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/clear-downloads"
  to = "https://anyvideo-backend.onrender.com/clear-downloads"
  status = 200
  force = true

[[redirects]]
  from = "/supported-platforms"
  to = "https://anyvideo-backend.onrender.com/supported-platforms"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://anyvideo-backend.onrender.com/health"
  status = 200
  force = true
